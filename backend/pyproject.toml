[project]
name = "triptiers-backend"
version = "1.0.0"
description = "TripTiers FastAPI backend — flight search, three-tier pricing, itinerary generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "gunicorn>=23.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "httpx>=0.28.0,<0.29",
  "google-genai>=1.20.0",
  "python-dateutil>=2.9.0",
  "supabase>=2.15.0,<2.16",
  "redis>=5.2.0",
  "tenacity>=9.1.0",
  "mcp>=1.9.0,<2",
  "python-dotenv>=1.1.0",
  "structlog>=25.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
triptiers = "app.main:run"
triptiers-seed = "app.db.seed:main"
triptiers-mcp = "app.mcp_server.travel_tools_server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "db/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
